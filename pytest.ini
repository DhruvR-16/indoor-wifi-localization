[pytest]
pythonpath = .
# Collect tests only from tests/. Without this, pytest also picks up
# scripts/evaluate_official_test.py (it matches the *_test.py pattern), which
# is a command-line script, not a test module. Collecting it imported xgboost
# into the same process as torch, and on macOS the two OpenMP runtimes that
# pulls in segfault the interpreter (see scripts/run_m2_a8_hybrid.py).
testpaths = tests
